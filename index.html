<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مشروع أمجد مريم - إرسال SMS</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background-color: #f4f7f6; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .card { background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.1); width: 350px; text-align: center; border-top: 5px solid #007bff; }
        input { width: 100%; padding: 12px; margin: 10px 0; border: 1px solid #ddd; border-radius: 8px; box-sizing: border-box; }
        button { width: 100%; padding: 14px; background-color: #28a745; color: white; border: none; border-radius: 8px; cursor: pointer; font-size: 16px; font-weight: bold; }
        #status { margin-top: 15px; font-size: 13px; color: #666; }
    </style>
</head>
<body>

<div class="card">
    <h2>نظام إرسال الطقس SMS</h2>
    <input type="text" id="city" placeholder="المدينة (مثلاً: Damascus)">
    <input type="text" id="phone" placeholder="رقم الموبايل (9639xxxxxxxx)">
    <button onclick="sendNow()">تشغيل النظام وإرسال SMS</button>
    <div id="status">سيفتح النظام نافذة بوابة الإرسال للتأكد من النتيجة</div>
</div>

<script>
function sendNow() {
    const city = document.getElementById('city').value.trim();
    const phone = document.getElementById('phone').value.trim();
    
    if (!city || !phone) {
        alert("يرجى إدخال كافة البيانات");
        return;
    }

    // بياناتك المعتمدة
    const user = "amjad";
    const pass = "A@112233A@112233";
    const sender = "ciedco-sms"; // الاسم الذي زودتك به الشركة
    const message = `تحية من نظام أمجد، الطقس في ${city} بانتظار التحديث.`;

    // الرابط المباشر
    const url = `https://www.ciedco-sms.net/api/sendsms.php?username=${user}&password=${encodeURIComponent(pass)}&numbers=${phone}&sender=${sender}&message=${encodeURIComponent(message)}&unicode=e`;

    // فتح الرابط في نافذة جديدة لرؤية رد السيرفر (E003 أو رقم العملية)
    window.open(url, '_blank', 'width=500,height=400');
}
</script>

</body>
</html>
