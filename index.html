<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مشروع التخرج - أمجد مريم</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background-color: #f0f2f5; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .card { background: white; padding: 30px; border-radius: 15px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); width: 350px; text-align: center; border-top: 5px solid #007bff; }
        input { width: 100%; padding: 12px; margin: 10px 0; border: 1px solid #ddd; border-radius: 8px; box-sizing: border-box; text-align: center; }
        button { width: 100%; padding: 14px; background-color: #007bff; color: white; border: none; border-radius: 8px; cursor: pointer; font-size: 18px; font-weight: bold; }
        .footer { margin-top: 20px; font-size: 11px; color: #999; }
    </style>
</head>
<body>

<div class="card">
    <h2>نظام SMS الذكي</h2>
    <p>بوابة Ciedco - مشروع م. أمجد مريم</p>
    
    <input type="text" id="city" placeholder="المدينة (مثلاً: Damascus)">
    <input type="text" id="phone" placeholder="رقم الهاتف (mno)">
    
    <button onclick="sendSmsDirect()">إرسال حالة الطقس</button>

    <div class="footer">
        تم التطوير بواسطة أمجد مريم - متخصص أنظمة حماية وشبكات
    </div>
</div>

<script>
function sendSmsDirect() {
    const city = document.getElementById('city').value.trim();
    const mno = document.getElementById('phone').value.trim(); // استخدام mno بدلاً من numbers

    if (!city || !mno) {
        alert("يرجى إدخال البيانات المطلوبة");
        return;
    }

    // البيانات الصحيحة حسب توثيق Ciedco وقسم المطورين
    const user = "appsyria00@gmail.com"; // اليوزر نيم هو الإيميل كما ذكرت
    const pass = "A@112233A@112233"; // كلمة المرور الخاصة بك
    const sender = "ciedco-sms"; // اسم المرسل
    const msg = `حالة الطقس في ${city}: صافي. مشروع م. أمجد مريم.`; // استخدام msg بدلاً من message
    const mt = "1"; // استخدام mt بدلاً من unicode (القيمة 1 للعربي)

    // بناء الرابط البرمجي بالمسميات التي حددتها (user, mno, msg, mt)
    const apiUrl = `https://www.ciedco-sms.net/api/sendsms.php?user=${encodeURIComponent(user)}&pass=${encodeURIComponent(pass)}&mno=${mno}&sender=${sender}&msg=${encodeURIComponent(msg)}&mt=${mt}`;

    // فتح الرابط لمشاهدة استجابة السيرفر وتجنب خطأ E003
    window.open(apiUrl, '_blank');
}
</script>

</body>
</html>
