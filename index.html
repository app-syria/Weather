<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مشروع تخرج أمجد مريم - نظام SMS</title>
    <style>
        :root { --main-bg: #f8f9fa; --btn-color: #007bff; }
        body { font-family: 'Tahoma', sans-serif; background: var(--main-bg); display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .card { background: #fff; padding: 30px; border-radius: 15px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); width: 350px; text-align: center; border-top: 5px solid var(--btn-color); }
        input { width: 100%; padding: 12px; margin: 10px 0; border: 1px solid #ddd; border-radius: 8px; text-align: center; font-size: 16px; }
        button { width: 100%; padding: 15px; background: var(--btn-color); color: #fff; border: none; border-radius: 8px; cursor: pointer; font-size: 18px; font-weight: bold; transition: 0.3s; }
        button:hover { background: #0056b3; }
        .footer { margin-top: 20px; font-size: 11px; color: #777; border-top: 1px solid #eee; padding-top: 10px; }
    </style>
</head>
<body>

<div class="card">
    <h2>نظام تنبيهات الطقس SMS</h2>
    <p>مشروع تخرج: أمجد مريم</p>
    <input type="text" id="city" placeholder="المدينة بالإنجليزية (مثل Damascus)">
    <input type="text" id="mno" placeholder="رقم الموبايل (9639xxxxxxxx)">
    <button onclick="sendSmsCiedco()">إرسال الرسالة بالعربي</button>
    <div class="footer">تطوير م. أمجد مريم - خبير أنظمة أمنية</div>
</div>

<script>
async function sendSmsCiedco() {
    const city = document.getElementById('city').value.trim();
    const mno = document.getElementById('mno').value.trim();

    if (!city || !mno) {
        alert("يرجى إدخال المدينة والرقم");
        return;
    }

    try {
        // جلب درجة الحرارة الحقيقية (اختياري لرفع جودة المشروع)
        const weatherRes = await fetch(`https://wttr.in/${city}?format=%t`);
        const temp = await weatherRes.text();

        // النص العربي الذي سيصل للموبايل
        const msgText = `حالة الطقس في ${city} هي ${temp}. مشروع التخرج للمهندس أمجد مريم.`;

        // البيانات المعتمدة من OpenAPI الخاص بك
        const username = "appsyria00@gmail.com"; 
        const password = "A@112233A@112233";
        const sid = "ciedco-sms"; 
        const mt = "1"; // رقم 1 هو مفتاح اللغة العربية في Ciedco

        // بناء الرابط البرمجي مع تشفير الرسالة بالكامل
        const url = `https://www.ciedco-sms.net/api/sendsms.php?username=${encodeURIComponent(username)}&password=${encodeURIComponent(password)}&mno=${mno}&sid=${sid}&msg=${encodeURIComponent(msgText)}&mt=${mt}&json=1`;

        // فتح الرابط في نافذة جديدة لمشاهدة "OK" وتأكيد النجاح
        window.open(url, '_blank');

    } catch (error) {
        alert("حدث خطأ في جلب البيانات، تأكد من اتصال الإنترنت");
    }
}
</script>

</body>
</html>
