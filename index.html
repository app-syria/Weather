<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>نظام SMS المطور - م. أمجد مريم</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, sans-serif; background: #f0f2f5; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .card { background: white; padding: 40px; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); width: 360px; text-align: center; border-top: 8px solid #007bff; }
        input { width: 100%; padding: 12px; margin: 10px 0; border: 1px solid #ddd; border-radius: 10px; text-align: center; font-size: 16px; }
        button { width: 100%; padding: 15px; background: #007bff; color: white; border: none; border-radius: 10px; cursor: pointer; font-size: 18px; font-weight: bold; width: 100%; }
        .footer { margin-top: 25px; font-size: 11px; color: #999; }
    </style>
</head>
<body>

<div class="card">
    <h2>بوابة التنبيهات الجوية</h2>
    <p>مشروع تخرج: أمجد مريم</p>
    <input type="text" id="city" placeholder="المدينة (English)">
    <input type="text" id="mno" placeholder="الرقم (9639xxxxxxxx)">
    <button onclick="sendSmsCiedco()">إرسال الرسالة الآن</button>
    <div class="footer">تطوير م. أمجد مريم - خبير أنظمة أمنية</div>
</div>

<script>
function sendSmsCiedco() {
    const city = document.getElementById('city').value.trim();
    let mno = document.getElementById('mno').value.trim();

    if (!city || !mno) {
        alert("يرجى إدخال البيانات");
        return;
    }

    // تنظيف الرقم: إزالة أي أصفار زائدة أو علامة + في البداية
    mno = mno.replace(/^00/, '').replace(/^\+/, '');

    const username = "appsyria00@gmail.com"; 
    const password = "A@112233A@112233";
    const sid = "ciedco-sms"; 
    
    // النص العربي المراد إرساله
    const msgText = `حالة الطقس في ${city} ممتازة. مشروع م. أمجد مريم.`;

    // بناء الرابط باستخدام المعايير المذكورة في توثيق Messaging
    // سنستخدم الرابط المباشر الذي أعطى Success سابقاً مع التأكد من mt=1 و json=1
    const params = new URLSearchParams({
        username: username,
        password: password,
        mno: mno,
        sid: sid,
        msg: msgText,
        mt: "1",
        json: "1"
    });

    const finalUrl = `https://www.ciedco-sms.net/api/sendsms.php?${params.toString()}`;

    console.log("الرابط الموجه للسيرفر: ", finalUrl);
    window.open(finalUrl, '_blank');
}
</script>

</body>
</html>
