<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>نظام تنظيم دور الغاز - م. أمجد مريم</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, sans-serif; background: #f4f4f4; text-align: center; padding: 50px; }
        .container { background: white; padding: 30px; border-radius: 15px; box-shadow: 0 5px 15px rgba(0,0,0,0.1); display: inline-block; width: 350px; border-top: 8px solid #007bff; }
        input { width: 90%; padding: 12px; margin: 10px 0; border: 1px solid #ddd; border-radius: 8px; text-align: center; }
        .queue-box { background: #e7f3ff; padding: 15px; border-radius: 10px; margin-top: 20px; display: none; }
        #queueNum { font-size: 24px; color: #007bff; font-weight: bold; }
        button { background: #28a745; color: white; border: none; padding: 15px; width: 90%; border-radius: 8px; cursor: pointer; font-weight: bold; }
    </style>
</head>
<body>

<div class="container">
    <h2>تطبيق "دورك" للغاز</h2>
    <p>مدينة التل - قسم الخدمات</p>
    
    <input type="text" id="nationalId" placeholder="الرقم الوطني">
    <input type="text" id="phone" placeholder="رقم الموبايل (9639...)">
    
    <button onclick="registerQueue()">حجز دور الآن</button>

    <div id="result" class="queue-box">
        تم التسجيل بنجاح!<br>
        رقمك التسلسلي هو:<br>
        <span id="queueNum"></span>
        <p style="font-size: 11px;">ستصلك رسالة SMS عند توفر الغاز.</p>
    </div>
</div>

<script>
let currentCounter = 449; // رقم تخيلي للبدء منه

function registerQueue() {
    const phone = document.getElementById('phone').value;
    if(!phone) return alert("يرجى إدخال الرقم");

    currentCounter++; // زيادة الرقم التسلسلي آلياً
    document.getElementById('queueNum').innerText = "#" + currentCounter;
    document.getElementById('result').style.display = "block";

    // هنا يتم استدعاء Ciedco API لإرسال رسالة تأكيد فورية
    console.log("إرسال رسالة تأكيد للرقم: " + phone);
}
</script>

</body>
</html>
