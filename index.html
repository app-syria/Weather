<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>مشروع التخرج - م. أمجد مريم</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background-color: #f4f4f9; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .card { background: white; padding: 30px; border-radius: 12px; box-shadow: 0 8px 20px rgba(0,0,0,0.1); width: 320px; text-align: center; }
        input { width: 100%; padding: 10px; margin: 10px 0; border: 1px solid #ccc; border-radius: 5px; box-sizing: border-box; }
        button { width: 100%; padding: 12px; background-color: #28a745; color: white; border: none; border-radius: 5px; cursor: pointer; font-size: 16px; font-weight: bold; }
        button:hover { background-color: #218838; }
    </style>
</head>
<body>

<div class="card">
    <h3>نظام رسائل الطقس</h3>
    <input type="text" id="city" placeholder="اسم المدينة بالإنجليزية">
    <input type="text" id="phone" placeholder="رقم الهاتف (mno)">
    <button onclick="sendSmsFinal()">إرسال SMS الآن</button>
</div>

<script>
function sendSmsFinal() {
    const city = document.getElementById('city').value.trim();
    const mno = document.getElementById('phone').value.trim();

    if (!city || !mno) {
        alert("يرجى ملء كافة الحقول");
        return;
    }

    // البيانات المعتمدة التي ذكرتها
    const user_mail = "appsyria00gmail.com"; 
    const pass_word = "A@112233A@112233";
    const sender_id = "ciedco-sms";
    const message_text = "Weather update for " + city + ". Project by Amjad.";
    const message_type = "1";

    // بناء الرابط يدوياً للتأكد من المسميات (user, pass, mno, msg, mt)
    // لاحظ استخدام encodeURIComponent للإيميل والرسالة حصراً
    const finalUrl = "https://www.ciedco-sms.net/api/sendsms.php?" + 
                     "user=" + encodeURIComponent(user_mail) + 
                     "&pass=" + encodeURIComponent(pass_word) + 
                     "&mno=" + mno + 
                     "&sender=" + sender_id + 
                     "&msg=" + encodeURIComponent(message_text) + 
                     "&mt=" + message_type;

    console.log("الرابط المرسل: ", finalUrl);
    
    // فتح الرابط مباشرة
    window.open(finalUrl, '_blank');
}
</script>

</body>
</html>
