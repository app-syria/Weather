<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>مشروع التخرج - م. أمجد مريم</title>
    <style>
        body { font-family: 'Tahoma', sans-serif; background: #f4f7f6; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .card { background: white; padding: 30px; border-radius: 15px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); width: 350px; text-align: center; border-top: 6px solid #28a745; }
        input { width: 100%; padding: 12px; margin: 10px 0; border: 1px solid #ddd; border-radius: 8px; text-align: center; font-size: 16px; }
        button { width: 100%; padding: 15px; background: #28a745; color: white; border: none; border-radius: 8px; cursor: pointer; font-size: 18px; font-weight: bold; width: 100%; }
    </style>
</head>
<body>

<div class="card">
    <h2>بوابة الرسائل الذكية</h2>
    <p>مشروع تخرج: أمجد مريم</p>
    <input type="text" id="city" placeholder="المدينة (English)">
    <input type="text" id="mno" placeholder="رقم الهاتف">
    <button onclick="sendSmsSecure()">إرسال SMS بالعربي</button>
</div>

<script>
function sendSmsSecure() {
    const city = document.getElementById('city').value.trim();
    const phone = document.getElementById('mno').value.trim();

    if (!city || !phone) {
        alert("يرجى إكمال البيانات");
        return;
    }

    // النص المراد إرساله
    const message = "حالة الطقس في " + city + " ممتازة. مشروع م. أمجد مريم.";

    // إنشاء كائن لتشفير المعلمات بشكل آمن تلقائياً
    const params = new URLSearchParams({
        username: "appsyria00@gmail.com",
        password: "A@112233A@112233",
        mno: phone,
        sid: "ciedco-sms",
        msg: message,
        mt: "1", // لضمان تفعيل اللغة العربية
        json: "1"
    });

    // بناء الرابط النهائي
    const finalUrl = `https://www.ciedco-sms.net/api/sendsms.php?${params.toString()}`;

    console.log("الرابط المشفر بالكامل: ", finalUrl);
    
    // فتح الرابط
    window.open(finalUrl, '_blank');
}
</script>

</body>
</html>
