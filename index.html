<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>نظام إرسال الطقس - أمجد</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f0f2f5; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .card { background: white; padding: 30px; border-radius: 15px; box-shadow: 0 8px 20px rgba(0,0,0,0.15); width: 90%; max-width: 400px; text-align: center; }
        h2 { color: #0056b3; margin-bottom: 20px; font-size: 24px; }
        input { width: 100%; padding: 12px; margin: 8px 0; border: 2px solid #ddd; border-radius: 10px; box-sizing: border-box; font-size: 16px; outline: none; transition: 0.3s; }
        input:focus { border-color: #0056b3; }
        button { width: 100%; padding: 14px; background-color: #28a745; color: white; border: none; border-radius: 10px; cursor: pointer; font-size: 18px; font-weight: bold; margin-top: 10px; }
        button:hover { background-color: #218838; }
        #status { margin-top: 20px; font-size: 15px; min-height: 40px; border-radius: 8px; padding: 10px; }
        .footer { margin-top: 20px; font-size: 12px; color: #777; border-top: 1px solid #eee; pt: 10px; }
    </style>
</head>
<body>

<div class="card">
    <h2>خدمة طقس SMS</h2>
    <input type="text" id="city" placeholder="اسم المدينة (مثلاً: Damascus)">
    <input type="text" id="phone" placeholder="رقم الهاتف (9639xxxxxxxx)">
    <button onclick="processAndSend()">إرسال الطقس الآن</button>
    <div id="status"></div>
    <div class="footer">المطور: أمجد مريم | Ciedco-SMS</div>
</div>

<script>
async function processAndSend() {
    const cityInput = document.getElementById('city').value.trim();
    const phoneInput = document.getElementById('phone').value.trim();
    const statusDiv = document.getElementById('status');

    if (!cityInput || !phoneInput) {
        statusDiv.style.color = "red";
        statusDiv.innerText = "⚠️ يرجى إدخال كافة البيانات";
        return;
    }

    statusDiv.style.color = "#333";
    statusDiv.innerText = "⏳ جاري جلب البيانات...";

    try {
        // مفتاح API الطقس الخاص بك
        const weatherKey = 'd821063092a96ff436c1a343fa0732f7';
        const weatherUrl = `https://api.openweathermap.org/data/2.5/weather?q=${encodeURIComponent(cityInput)}&appid=${weatherKey}&units=metric&lang=ar`;
        
        const weatherRes = await fetch(weatherUrl);
        const weatherData = await weatherRes.json();

        if (!weatherRes.ok) {
            throw new Error(weatherData.message || "فشل جلب الطقس");
        }

        const temp = Math.round(weatherData.main.temp);
        const desc = weatherData.weather[0].description;
        const message = `حالة الطقس في ${cityInput}: ${desc}، الحرارة: ${temp}°C. تحياتي، أمجد.`;

        // بيانات حساب Ciedco الخاص بك
        const smsUser = "amjad";
        const smsPass = "A@112233A@112233";
        const sender = "ciedco-sms";

        // بناء رابط الإرسال
        const smsUrl = `https://www.ciedco-sms.net/api/sendsms.php?username=${smsUser}&password=${smsPass}&numbers=${phoneInput}&sender=${sender}&message=${encodeURIComponent(message)}&unicode=e`;

        // إرسال طلب الـ SMS
        // ملاحظة: 'no-cors' ضرورية للإرسال من المتصفح مباشرة لخدمة Ciedco
        fetch(smsUrl, { mode: 'no-cors' });

        statusDiv.style.color = "green";
        statusDiv.innerHTML = `✅ تم بنجاح!<br>الجو: ${desc} (${temp}°C)`;

    } catch (error) {
        statusDiv.style.color = "red";
        statusDiv.innerText = "❌ خطأ: " + error.message;
    }
}
</script>

</body>
</html>
