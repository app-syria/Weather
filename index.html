<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>نظام أمجد مريم - Ciedco SMS</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background-color: #f8f9fa; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .card { background: white; padding: 30px; border-radius: 15px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); width: 350px; text-align: center; border-top: 5px solid #007bff; }
        h2 { color: #333; margin-bottom: 20px; }
        input { width: 100%; padding: 12px; margin: 10px 0; border: 1px solid #ddd; border-radius: 8px; box-sizing: border-box; }
        button { width: 100%; padding: 14px; background-color: #007bff; color: white; border: none; border-radius: 8px; cursor: pointer; font-size: 18px; font-weight: bold; }
        #status { margin-top: 20px; font-size: 14px; color: #666; }
    </style>
</head>
<body>

<div class="card">
    <h2>إرسال الطقس SMS</h2>
    <input type="text" id="city" placeholder="المدينة (Damascus)">
    <input type="text" id="phone" placeholder="الرقم (9639xxxxxxxx)">
    <button onclick="sendFinalSms()">إرسال الطلب</button>
    <div id="status">سيفتح النظام نافذة بوابة الإرسال</div>
</div>

<script>
function sendFinalSms() {
    const city = document.getElementById('city').value.trim();
    const phone = document.getElementById('phone').value.trim();
    
    // البيانات الخاصة بحسابك
    const u = "amjad"; //
    const p = "A@112233A@112233"; //
    const s = "ciedco-sms"; //
    const msg = `الطقس في ${city} بانتظار التحديث. مشروع أمجد مريم.`;

    // بناء الرابط البرمجي مع التأكد من أسماء المتغيرات
    const url = `https://www.ciedco-sms.net/api/sendsms.php?username=${u}&password=${p}&numbers=${phone}&sender=${s}&message=${encodeURIComponent(msg)}&unicode=e`;

    // فتح الرابط في نافذة جديدة
    window.open(url, '_blank', 'width=500,height=400');
}
</script>

</body>
</html>
