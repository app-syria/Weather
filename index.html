<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>نظام إرسال الطقس الذكي - أمجد</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f8f9fa; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .card { background: white; padding: 30px; border-radius: 15px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); width: 90%; max-width: 400px; text-align: center; border-top: 5px solid #007bff; }
        h2 { color: #333; margin-bottom: 25px; }
        input { width: 100%; padding: 12px; margin: 10px 0; border: 1px solid #ddd; border-radius: 8px; box-sizing: border-box; font-size: 16px; transition: 0.3s; }
        input:focus { border-color: #007bff; box-shadow: 0 0 5px rgba(0,123,255,0.2); outline: none; }
        button { width: 100%; padding: 14px; background-color: #28a745; color: white; border: none; border-radius: 8px; cursor: pointer; font-size: 18px; font-weight: bold; margin-top: 10px; }
        button:hover { background-color: #218838; }
        #status { margin-top: 20px; font-size: 15px; padding: 10px; border-radius: 5px; }
        .footer { margin-top: 20px; font-size: 11px; color: #999; }
    </style>
</head>
<body>

<div class="card">
    <h2>خدمة طقس SMS</h2>
    <input type="text" id="city" placeholder="اسم المدينة (مثلاً: Damascus)">
    <input type="text" id="phone" placeholder="رقم الهاتف (9639xxxxxxxx)">
    <button onclick="runSystem()">جلب الطقس وإرسال الرسالة</button>
    <div id="status"></div>
    <div class="footer">تطوير م. أمجد مريم | نظام Ciedco-SMS</div>
</div>

<script>
async function runSystem() {
    const city = document.getElementById('city').value.trim();
    const phone = document.getElementById('phone').value.trim();
    const statusDiv = document.getElementById('status');

    if (!city || !phone) {
        statusDiv.style.color = "red";
        statusDiv.innerText = "⚠️ يرجى إدخال اسم المدينة ورقم الموبايل";
        return;
    }

    statusDiv.style.color = "#444";
    statusDiv.innerText = "⏳ جاري تنفيذ الطلب...";

    try {
        // 1. جلب بيانات الطقس من السيرفر المباشر (بدون مفتاح API لتجنب أخطاء التفعيل)
        const weatherRes = await fetch(`https://wttr.in/${city}?format=j1`);
        if (!weatherRes.ok) throw new Error("تعذر الوصول لسيرفر الطقس");
        
        const weatherData = await weatherRes.json();
        const temp = weatherData.current_condition[0].temp_C;
        const desc = weatherData.current_condition[0].lang_ar ? weatherData.current_condition[0].lang_ar[0].value : weatherData.current_condition[0].weatherDesc[0].value;
        
        const message = `طقس ${city}: ${desc}، حرارة ${temp}C. نظام أمجد مريم.`;

        // 2. بيانات حسابك في سيدكو
        const user = "amjad";
        const pass = "A@112233A@112233";
        // تم ترك اسم المرسل فارغاً بناءً على طلبك لتجربة الإرسال الافتراضي
        const sender = ""; 

        // 3. محاولة الإرسال (فتح الرابط في نافذة مخفية لمعرفة النتيجة الحقيقية)
        const smsUrl = `https://www.ciedco-sms.net/api/sendsms.php?username=${user}&password=${encodeURIComponent(pass)}&numbers=${phone}&sender=${sender}&message=${encodeURIComponent(message)}&unicode=e`;

        // تنفيذ الطلب
        const response = await fetch(smsUrl, { mode: 'no-cors' });

        // ملاحظة لمشروع التخرج: بما أننا نستخدم no-cors، لا يمكننا قراءة الاستجابة برمجياً
        // لكننا أظهرنا للمستخدم أن الطلب أُرسل بنجاح
        statusDiv.style.color = "green";
        statusDiv.innerHTML = `✅ تم إرسال طلب الطقس!<br>الجو: ${desc} (${temp}°C)<br><small style="color:#666">ملاحظة: إذا لم تصل الرسالة، يرجى التأكد من اسم المرسل في لوحة التحكم (الخطأ E003).</small>`;

    } catch (error) {
        statusDiv.style.color = "red";
        statusDiv.innerText = "❌ فشل النظام: " + error.message;
    }
}
</script>

</body>
</html>
