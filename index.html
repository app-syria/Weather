<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>نظام إرسال الطقس - أمجد</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background-color: #f4f7f6; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .card { background: white; padding: 25px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); width: 100%; max-width: 380px; text-align: center; }
        h2 { color: #2c3e50; }
        input { width: 100%; padding: 10px; margin: 8px 0; border: 1px solid #ddd; border-radius: 6px; box-sizing: border-box; }
        button { width: 100%; padding: 12px; background-color: #3498db; color: white; border: none; border-radius: 6px; cursor: pointer; font-size: 16px; }
        button:hover { background-color: #2980b9; }
        #status { margin-top: 15px; font-weight: bold; }
    </style>
</head>
<body>

<div class="card">
    <h2>خدمة طقس SMS المباشرة</h2>
    <input type="text" id="city" placeholder="اسم المدينة بالإنجليزية (مثلاً: Damascus)">
    <input type="text" id="phone" placeholder="رقم الموبايل (9639xxxxxxxx)">
    <button onclick="sendWeatherNow()">إرسال حالة الطقس</button>
    <div id="status"></div>
</div>

<script>
async function sendWeatherNow() {
    const city = document.getElementById('city').value.trim();
    const phone = document.getElementById('phone').value.trim();
    const statusDiv = document.getElementById('status');

    if (!city || !phone) {
        statusDiv.innerText = "⚠️ يرجى تعبئة البيانات";
        return;
    }

    statusDiv.style.color = "blue";
    statusDiv.innerText = "⏳ جاري جلب الطقس بدون API...";

    try {
        // استخدام سيرفر wttr.in البديل (لا يتطلب مفتاح API)
        const response = await fetch(`https://wttr.in/${city}?format=j1`);
        const data = await response.json();

        const temp = data.current_condition[0].temp_C;
        const desc = data.current_condition[0].lang_ar ? data.current_condition[0].lang_ar[0].value : data.current_condition[0].weatherDesc[0].value;
        
        const message = `حالة الطقس في ${city}: ${desc}، الحرارة: ${temp} درجة. مع تحيات الفني أمجد مريم.`;

        // بيانات Ciedco الخاصة بك
        const smsUrl = `https://www.ciedco-sms.net/api/sendsms.php?username=amjad&password=${encodeURIComponent('A@112233A@112233')}&numbers=${phone}&sender=ciedco-sms&message=${encodeURIComponent(message)}&unicode=e`;

        // إرسال SMS
        fetch(smsUrl, { mode: 'no-cors' });

        statusDiv.style.color = "green";
        statusDiv.innerHTML = `✅ تم الإرسال بنجاح!<br>${desc} (${temp}°C)`;

    } catch (error) {
        statusDiv.style.color = "red";
        statusDiv.innerText = "❌ تعذر جلب الطقس، تأكد من اسم المدينة";
    }
}
</script>

</body>
</html>
