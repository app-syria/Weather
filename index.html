<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مشروع التخرج - م. أمجد مريم</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, sans-serif; background: #f4f7f6; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .card { background: white; padding: 30px; border-radius: 15px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); width: 350px; text-align: center; border-top: 6px solid #28a745; }
        h2 { color: #333; margin-bottom: 20px; }
        input { width: 100%; padding: 12px; margin: 10px 0; border: 1px solid #ddd; border-radius: 8px; box-sizing: border-box; text-align: center; font-size: 16px; }
        button { width: 100%; padding: 15px; background: #28a745; color: white; border: none; border-radius: 8px; cursor: pointer; font-size: 18px; font-weight: bold; transition: 0.3s; }
        button:hover { background: #218838; }
        .footer { margin-top: 20px; font-size: 11px; color: #999; border-top: 1px solid #eee; padding-top: 10px; }
    </style>
</head>
<body>

<div class="card">
    <h2>نظام تنبيهات SMS</h2>
    <p>بوابة Ciedco - م. أمجد مريم</p>
    
    <input type="text" id="city" placeholder="اسم المدينة (مثلاً: Damascus)">
    <input type="text" id="mno" placeholder="رقم الهاتف (9639xxxxxxxx)">
    
    <button onclick="sendSmsNow()">إرسال الرسالة بالعربي</button>

    <div class="footer">
        تطوير: أمجد مريم - خبير أنظمة أمنية وشبكات
    </div>
</div>

<script>
function sendSmsNow() {
    const city = document.getElementById('city').value.trim();
    const mno = document.getElementById('mno').value.trim();

    if (!city || !mno) {
        alert("يرجى إدخال المدينة والرقم أولاً");
        return;
    }

    // البيانات المعتمدة حسب ملف OpenAPI الذي أرسلته
    const username = "appsyria00@gmail.com"; 
    const password = "A@112233A@112233";
    const sid = "ciedco-sms"; 
    const mt = "1"; // ضرورية جداً لإرسال العربي (Unicode)

    // نص الرسالة - تأكد أن النص بسيط لضمان وصوله
    const msgText = "حالة الطقس في " + city + " ممتازة. مشروع تخرج أمجد مريم.";

    // بناء الرابط البرمجي الدقيق
    const apiUrl = "https://www.ciedco-sms.net/api/sendsms.php?" + 
                   "username=" + encodeURIComponent(username) + 
                   "&password=" + encodeURIComponent(password) + 
                   "&mno=" + mno + 
                   "&sid=" + sid + 
                   "&msg=" + encodeURIComponent(msgText) + 
                   "&mt=" + mt + 
                   "&json=1";

    console.log("الرابط جاهز للإرسال...");

    // فتح الرابط في نافذة جديدة (أضمن وسيلة لتجاوز حظر المتصفحات ولرؤية OK)
    window.open(apiUrl, '_blank');
}
</script>

</body>
</html>
