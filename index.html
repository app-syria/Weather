<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>مشروع أمجد مريم - Ciedco SMS</title>
    <style>
        body { font-family: 'Arial', sans-serif; background: #e9ecef; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .card { background: white; padding: 30px; border-radius: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.2); width: 340px; text-align: center; }
        input { width: 100%; padding: 12px; margin: 10px 0; border: 1px solid #ccc; border-radius: 8px; box-sizing: border-box; text-align: center; }
        button { width: 100%; padding: 15px; background: #28a745; color: white; border: none; border-radius: 8px; cursor: pointer; font-size: 18px; font-weight: bold; transition: 0.3s; }
        button:hover { background: #218838; }
    </style>
</head>
<body>

<div class="card">
    <h2>نظام الرسائل القصيرة</h2>
    <p>مشروع تخرج م. أمجد مريم</p>
    <input type="text" id="city" placeholder="المدينة (مثل: Damascus)">
    <input type="text" id="mno" placeholder="رقم الموبايل (9639xxxxxxxx)">
    <button onclick="sendSmsFinal()">إرسال بنجاح الآن</button>
</div>

<script>
function sendSmsFinal() {
    const city = document.getElementById('city').value.trim();
    const mno = document.getElementById('mno').value.trim();

    if (!city || !mno) {
        alert("يرجى إكمال البيانات");
        return;
    }

    // البيانات المعتمدة حسب OpenAPI
    const username = "appsyria00@gmail.com"; 
    const password = "A@112233A@112233";
    const sid = "ciedco-sms"; 
    
    // نص الرسالة
    const rawMsg = `حالة الطقس في ${city} ممتازة. مشروع أمجد مريم.`;

    // ملاحظة هامة: mt=1 ضروري جداً لإرسال اليونيكود (العربي)
    const mt = "1";

    // بناء الرابط البرمجي
    // استخدمنا encodeURIComponent لضمان تحويل الفراغات والحروف العربية لأكواد يفهمها السيرفر
    const url = `https://www.ciedco-sms.net/api/sendsms.php?username=${encodeURIComponent(username)}&password=${encodeURIComponent(password)}&mno=${mno}&sid=${sid}&msg=${encodeURIComponent(rawMsg)}&mt=${mt}&json=1`;

    console.log("الرابط المرسل: ", url);
    
    // فتح الرابط لمشاهدة "OK" وتأكيد الإرسال
    window.open(url, '_blank');
}
</script>

</body>
</html>
