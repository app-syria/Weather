<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>مشروع تخرج م. أمجد مريم - Ciedco</title>
    <style>
        body { font-family: 'Tahoma', sans-serif; background: #f0f2f5; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .card { background: white; padding: 30px; border-radius: 15px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); width: 350px; text-align: center; border-top: 6px solid #28a745; }
        input { width: 100%; padding: 12px; margin: 10px 0; border: 1px solid #ddd; border-radius: 8px; box-sizing: border-box; text-align: center; font-size: 16px; }
        button { width: 100%; padding: 15px; background: #28a745; color: white; border: none; border-radius: 8px; cursor: pointer; font-size: 18px; font-weight: bold; width: 100%; }
        .footer { margin-top: 20px; font-size: 11px; color: #999; }
    </style>
</head>
<body>

<div class="card">
    <h2>نظام تنبيهات SMS</h2>
    <p>بوابة Ciedco - م. أمجد مريم</p>
    <input type="text" id="city" placeholder="المدينة (مثل: Damascus)">
    <input type="text" id="mno" placeholder="رقم الهاتف (9639xxxxxxxx)">
    <button onclick="sendSmsCiedco()">إرسال الرسالة بالعربي</button>
    <div class="footer">تطوير: أمجد مريم - متخصص أنظمة أمنية</div>
</div>

<script>
// دالة لتحويل النص العربي إلى صيغة يفهمها سيرفر الـ SMS (Hex)
function encodeArabic(text) {
    let hex = "";
    for (let i = 0; i < text.length; i++) {
        let charHex = text.charCodeAt(i).toString(16).toUpperCase();
        while (charHex.length < 4) charHex = "0" + charHex;
        hex += charHex;
    }
    return hex;
}

function sendSmsCiedco() {
    const city = document.getElementById('city').value.trim();
    const mno = document.getElementById('mno').value.trim();

    if (!city || !mno) {
        alert("يرجى إدخال البيانات");
        return;
    }

    const username = "appsyria00@gmail.com"; 
    const password = "A@112233A@112233";
    const sid = "ciedco-sms"; 
    const mt = "1"; // وضع اليونيكود

    // النص العربي المراد إرساله
    const msgText = `حالة الطقس في ${city} ممتازة. مشروع م. أمجد مريم.`;

    // بناء الرابط البرمجي الدقيق
    const url = `https://www.ciedco-sms.net/api/sendsms.php?username=${encodeURIComponent(username)}&password=${encodeURIComponent(password)}&mno=${mno}&sid=${sid}&msg=${encodeURIComponent(msgText)}&mt=${mt}&json=1`;

    console.log("الرابط الموجه للسيرفر: ", url);
    window.open(url, '_blank');
}
</script>
