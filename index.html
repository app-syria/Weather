<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مشروع التخرج - م. أمجد مريم</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f8f9fa; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .card { background: white; padding: 35px; border-radius: 15px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); width: 350px; text-align: center; border-top: 6px solid #28a745; }
        h2 { color: #333; margin-bottom: 5px; }
        p { color: #777; font-size: 13px; margin-bottom: 25px; }
        input { width: 100%; padding: 12px; margin: 10px 0; border: 1px solid #ddd; border-radius: 8px; box-sizing: border-box; text-align: center; font-size: 15px; }
        button { width: 100%; padding: 15px; background-color: #28a745; color: white; border: none; border-radius: 8px; cursor: pointer; font-size: 18px; font-weight: bold; transition: 0.3s; margin-top: 10px; }
        button:hover { background-color: #218838; transform: translateY(-2px); }
        .footer { margin-top: 25px; font-size: 11px; color: #bbb; border-top: 1px solid #eee; padding-top: 15px; }
    </style>
</head>
<body>

<div class="card">
    <h2>نظام SMS الذكي</h2>
    <p>بوابة Ciedco - مشروع التخرج</p>
    
    <input type="text" id="city" placeholder="المدينة (Damascus)">
    <input type="text" id="mno" placeholder="رقم المستلم (9639xxxxxxxx)">
    
    <button onclick="sendCiedcoSms()">إرسال حالة الطقس</button>

    <div class="footer">
        المبرمج: أمجد مريم - متخصص أنظمة أمنية وشبكات
    </div>
</div>

<script>
function sendCiedcoSms() {
    const city = document.getElementById('city').value.trim();
    const mno = document.getElementById('mno').value.trim();

    if (!city || !mno) {
        alert("يرجى إدخال اسم المدينة ورقم الهاتف");
        return;
    }

    // البيانات المصححة 100% بناءً على آخر تحديث منك
    const user = "appsyria00@gmail.com"; 
    const pass = "A@112233A@112233";
    const sender = "ciedco-sms";
    const msg = `Weather Update: The weather in ${city} is Clear. Project by Amjad Maryam.`;
    const mt = "1"; 

    // بناء الرابط البرمجي بالمسميات: user, pass, mno, msg, mt
    const apiUrl = `https://www.ciedco-sms.net/api/sendsms.php?user=${encodeURIComponent(user)}&pass=${encodeURIComponent(pass)}&mno=${mno}&sender=${sender}&msg=${encodeURIComponent(msg)}&mt=${mt}`;

    console.log("الرابط الموجه للسيرفر: ", apiUrl);

    // فتح الرابط في نافذة جديدة
    window.open(apiUrl, '_blank');
}
</script>

</body>
</html>
