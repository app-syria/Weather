<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>مشروع أمجد مريم - Ciedco API</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #f0f2f5; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .card { background: white; padding: 30px; border-radius: 15px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); width: 350px; text-align: center; border-top: 6px solid #007bff; }
        input { width: 100%; padding: 12px; margin: 10px 0; border: 1px solid #ddd; border-radius: 8px; box-sizing: border-box; text-align: center; }
        button { width: 100%; padding: 14px; background: #007bff; color: white; border: none; border-radius: 8px; cursor: pointer; font-size: 18px; font-weight: bold; width: 100%; }
        .info { font-size: 11px; color: #888; margin-top: 15px; }
    </style>
</head>
<body>

<div class="card">
    <h2>نظام طقس Ciedco</h2>
    <p>مشروع تخرج م. أمجد مريم</p>
    
    <input type="text" id="city" placeholder="المدينة (مثلاً Damascus)">
    <input type="text" id="mno" placeholder="رقم الهاتف (9639xxxxxxxx)">
    
    <button onclick="sendSmsCiedco()">إرسال SMS</button>

    <div class="info">
        تم الضبط بناءً على مواصفات OpenAPI الرسمية
    </div>
</div>

<script>
function sendSmsCiedco() {
    const city = document.getElementById('city').value.trim();
    const mno = document.getElementById('mno').value.trim();

    if (!city || !mno) {
        alert("أدخل المدينة والرقم");
        return;
    }

    // المسميات الدقيقة حسب الملف اللي بعته (username, password, sid)
    const username = "appsyria00@gmail.com"; 
    const password = "A@112233A@112233";
    const sid = "ciedco-sms"; // تم تغيير sender لـ sid
    const msg = `حالة الطقس في ${city} صافية. مشروع أمجد مريم.`;
    const mt = "1"; 

    // بناء الرابط حسب قسم الـ GET في الملف
    const url = `https://www.ciedco-sms.net/api/sendsms.php?username=${encodeURIComponent(username)}&password=${encodeURIComponent(password)}&mno=${mno}&sid=${sid}&msg=${encodeURIComponent(msg)}&mt=${mt}&json=1`;

    console.log("الرابط المحدث: ", url);
    window.open(url, '_blank');
}
</script>

</body>
</html>
