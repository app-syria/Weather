<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>مشروع التخرج - م. أمجد مريم</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #eef2f3; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .card { background: white; padding: 40px; border-radius: 20px; box-shadow: 0 15px 35px rgba(0,0,0,0.1); width: 360px; text-align: center; border-top: 8px solid #28a745; }
        h2 { color: #333; margin-bottom: 5px; }
        .status { color: #28a745; font-weight: bold; margin-bottom: 20px; display: block; }
        input { width: 100%; padding: 12px; margin: 10px 0; border: 1px solid #ddd; border-radius: 10px; text-align: center; font-size: 16px; }
        button { width: 100%; padding: 15px; background: #28a745; color: white; border: none; border-radius: 10px; cursor: pointer; font-size: 18px; font-weight: bold; transition: 0.3s; }
        button:hover { background: #218838; transform: scale(1.02); }
        .footer { margin-top: 25px; font-size: 11px; color: #999; border-top: 1px solid #eee; padding-top: 15px; }
    </style>
</head>
<body>

<div class="card">
    <h2>نظام التنبيهات الذكي</h2>
    <span class="status">● النظام متصل وجاهز</span>
    
    <input type="text" id="city" placeholder="أدخل اسم المدينة (English)">
    <input type="text" id="mno" placeholder="رقم الموبايل">
    
    <button onclick="sendFinalSuccess()">إرسال التقرير الجوي</button>

    <div class="footer">
        تطوير المهندس أمجد مريم - خبير أنظمة أمنية وشبكات
    </div>
</div>

<script>
function sendFinalSuccess() {
    const city = document.getElementById('city').value.trim();
    const phone = document.getElementById('mno').value.trim();

    if (!city || !phone) {
        alert("يرجى إكمال البيانات");
        return;
    }

    const message = `حالة الطقس في ${city} ممتازة. مشروع أمجد مريم.`;

    const params = new URLSearchParams({
        username: "appsyria00@gmail.com",
        password: "A@112233A@112233",
        mno: phone,
        sid: "ciedco-sms",
        msg: message,
        mt: "1",
        json: "1"
    });

    window.open(`https://www.ciedco-sms.net/api/sendsms.php?${params.toString()}`, '_blank');
}
</script>

</body>
</html>
